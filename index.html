<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf2ef" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/pinch-192.png" />
    <title>Pinch</title>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skipToContent"
      >Skip to content</a
    >
    <header class="topbar">
      <a class="brand" href="./" aria-label="Pinch">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span>Pinch</span>
      </a>
      <div class="preferences">
        <label class="preference-control" for="locale">
          <span data-i18n="languageLabel">Language</span>
          <select id="locale" name="locale">
            <option value="en" data-i18n="english">English</option>
            <option value="fr" data-i18n="french">French</option>
          </select>
        </label>
        <label class="preference-control" for="theme">
          <span data-i18n="appearanceLabel">Appearance</span>
          <select id="theme" name="theme">
            <option value="system" data-i18n="systemTheme">System</option>
            <option value="light" data-i18n="lightTheme">Light</option>
            <option value="dark" data-i18n="darkTheme">Dark</option>
          </select>
        </label>
      </div>
    </header>
    <div class="offline-notice" hidden>
      <p class="offline-status" role="status"></p>
      <button
        class="accept-update"
        type="button"
        data-i18n="acceptUpdate"
        hidden
      >
        Update Pinch
      </button>
    </div>
    <main id="main" tabindex="-1">
      <section class="workbench" aria-labelledby="workbench-title">
        <p class="workbench-kicker" data-i18n="workbenchKicker">
          YOUR KITCHEN WORKBENCH
        </p>
        <h1 id="workbench-title" data-i18n="workbenchTitle">
          Recipes, in good measure.
        </h1>
        <div class="library-heading">
          <h2 data-i18n="libraryLabel">Recipes</h2>
          <button id="new-recipe" type="button" data-i18n="newRecipe">
            New recipe
          </button>
        </div>
        <nav id="library" class="library" aria-label="Recipes"></nav>
        <div class="recipe-heading">
          <h2 id="recipe-title"></h2>
          <button id="edit-recipe" type="button" data-i18n="editRecipe">
            Edit recipe
          </button>
        </div>
        <div class="measure-controls">
          <div>
            <label for="target-servings" data-i18n="targetServings"
              >Servings</label
            >
            <div class="servings-dial">
              <button
                id="decrease-servings"
                type="button"
                aria-label="Fewer servings"
                title="Fewer servings"
              >
                -
              </button>
              <input
                id="target-servings"
                type="number"
                min="1"
                max="24"
                step="1"
                aria-describedby="target-error"
              />
              <button
                id="increase-servings"
                type="button"
                aria-label="More servings"
                title="More servings"
              >
                +
              </button>
            </div>
            <p id="target-error" class="field-error" role="status"></p>
          </div>
          <label class="preference-control" for="units">
            <span data-i18n="unitsLabel">Units</span>
            <select id="units">
              <option value="metric" data-i18n="metric">Metric</option>
              <option value="imperial" data-i18n="imperial">
                Imperial (US)
              </option>
            </select>
          </label>
        </div>
        <div class="recipe-content">
          <section aria-labelledby="ingredients-heading">
            <h3 id="ingredients-heading" data-i18n="ingredientsLabel">
              Ingredients
            </h3>
            <ul id="recipe-ingredients" class="ingredients"></ul>
          </section>
          <section aria-labelledby="steps-heading">
            <h3 id="steps-heading" data-i18n="stepsLabel">Steps</h3>
            <ol id="recipe-steps" class="steps"></ol>
          </section>
        </div>
        <button id="add-shopping" type="button" data-i18n="addShopping">
          Add to shopping list
        </button>
        <button id="start-cooking" type="button" data-i18n="startCooking">
          Start cooking
        </button>
        <section id="editor" hidden aria-labelledby="editor-heading">
          <h2 id="editor-heading" data-i18n="editorLabel">Recipe editor</h2>
          <form id="recipe-form" novalidate>
            <label for="recipe-name" data-i18n="titleLabel">Title</label>
            <input
              id="recipe-name"
              name="title"
              aria-describedby="title-error"
            />
            <p id="title-error" class="field-error"></p>
            <label for="base-servings" data-i18n="baseServings"
              >Base servings</label
            >
            <input
              id="base-servings"
              name="baseServings"
              type="number"
              min="1"
              max="24"
              step="1"
              aria-describedby="base-error"
            />
            <p id="base-error" class="field-error"></p>
            <label for="ingredient-lines" data-i18n="ingredientLines"
              >Ingredients (one per line)</label
            >
            <textarea
              id="ingredient-lines"
              name="ingredients"
              rows="6"
              aria-describedby="ingredients-error"
            ></textarea>
            <p id="ingredients-error" class="field-error"></p>
            <label for="step-lines" data-i18n="stepLines"
              >Steps (one per line)</label
            >
            <textarea
              id="step-lines"
              name="steps"
              rows="6"
              aria-describedby="steps-error"
            ></textarea>
            <p id="steps-error" class="field-error"></p>
            <div class="editor-actions">
              <button type="submit" data-i18n="saveRecipe">Save recipe</button>
              <button id="cancel-editor" type="button" data-i18n="cancel">
                Cancel
              </button>
            </div>
          </form>
        </section>
        <section class="shopping" aria-labelledby="shopping-heading">
          <div class="library-heading">
            <h2 id="shopping-heading" data-i18n="shoppingLabel">
              Shopping list
            </h2>
            <button
              id="clear-checked"
              type="button"
              data-i18n="clearChecked"
              disabled
            >
              Clear checked
            </button>
          </div>
          <p id="shopping-empty" class="storage-note" data-i18n="shoppingEmpty">
            Your shopping list is empty.
          </p>
          <ul id="shopping-list"></ul>
        </section>
      </section>
      <section aria-labelledby="data-heading">
        <h2 id="data-heading" data-i18n="dataLabel">Device data</h2>
        <div class="editor-actions">
          <button id="export-data" type="button" data-i18n="exportData">
            Export JSON
          </button>
          <button id="import-data" type="button" data-i18n="importData">
            Import JSON
          </button>
          <input
            id="import-file"
            type="file"
            accept=".json,application/json"
            hidden
          />
          <button id="reset-data" type="button" data-i18n="resetData">
            Clear Pinch data
          </button>
        </div>
      </section>
      <p
        id="storage-warning"
        class="status"
        role="status"
        aria-live="polite"
      ></p>
      <button
        id="temporary-session"
        type="button"
        hidden
        data-i18n="temporarySession"
      >
        Continue without saving
      </button>
      <p class="storage-note" data-i18n="localDataNotice">
        Saved on this device only. Editing in multiple tabs is unsupported.
      </p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <dialog id="cook-dialog" aria-labelledby="cook-title">
      <div class="cook-layout">
        <header class="cook-header">
          <h2 id="cook-title"></h2>
          <label class="preference-control" for="cook-locale">
            <span data-i18n="languageLabel">Language</span>
            <select id="cook-locale">
              <option value="en" data-i18n="english">English</option>
              <option value="fr" data-i18n="french">French</option>
            </select>
          </label>
          <button id="close-cooking" type="button" autofocus>&times;</button>
        </header>
        <div id="cook-scroll" class="cook-scroll" tabindex="0">
          <div
            id="cook-current"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >
            <p id="cook-progress" class="cook-progress"></p>
            <p id="cook-step" class="cook-step"></p>
          </div>
        </div>
        <footer class="cook-footer">
          <div class="offline-notice" hidden>
            <p class="offline-status" role="status"></p>
            <button
              class="accept-update"
              type="button"
              data-i18n="acceptUpdate"
              hidden
            >
              Update Pinch
            </button>
          </div>
          <p id="cook-feedback" role="status" aria-live="polite"></p>
          <nav class="cook-navigation">
            <button id="cook-previous" type="button">&larr;</button>
            <button id="cook-next" type="button">&rarr;</button>
          </nav>
        </footer>
      </div>
    </dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
