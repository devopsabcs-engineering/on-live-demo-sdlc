name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      governance_approved:
        description: Confirm Product Owner, Security Team, and Tech Lead approval
        required: true
        default: false
        type: boolean
      approved_commit:
        description: Exact approved commit SHA
        required: true
        type: string
      approved_tree:
        description: Exact approved Git tree SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    if: ${{ inputs.governance_approved && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved artifact pin
        shell: bash
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          APPROVED_TREE: ${{ inputs.approved_tree }}
        run: |
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "${APPROVED_COMMIT}^{tree}")" = "$APPROVED_TREE"
          git merge-base --is-ancestor "$APPROVED_COMMIT" "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$APPROVED_TREE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install portable Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint and check formatting
        run: npm run lint

      - name: Check workflow formatting
        run: npx prettier --check .github/workflows/pages.yml

      - name: Run unit tests
        run: npm run test:unit

      - name: Check translation parity
        run: npm run check:i18n

      - name: Run portable Playwright gate
        run: npm run test:e2e

      - name: Retain tested Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinch-pages-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  build-pages-artifact:
    name: Package immutable Pages artifact
    if: ${{ inputs.governance_approved && github.ref == 'refs/heads/main' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: pinch-pages-${{ github.sha }}
          path: dist

      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Deploy Pages
    if: ${{ inputs.governance_approved && github.ref == 'refs/heads/main' }}
    needs: build-pages-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy immutable Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4