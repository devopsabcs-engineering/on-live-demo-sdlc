name: Pinch CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install managed Chromium on Ubuntu
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install managed Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Build
        run: npm run build
      - name: Lint and format
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Catalog parity
        run: npm run check:i18n
      - name: Browser smoke
        run: npm run test:e2e
      - name: Retain browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
